name: release

on:
  push:
    tags:
      - v*

env:
  GO_VERSION: "1.26"

jobs:

  GoReleaser:
    name: release
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
          workdir: cmd/gofactory/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}